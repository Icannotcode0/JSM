<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account · JSM</title>
    <!-- See index.html: gates every "start hidden" reveal rule on JS being on. -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card" data-reveal>
      <div class="auth-brand">
        <span class="auth-brand-mark">
          <span class="brand-mark">J</span>
          JSM
        </span>
        <p class="auth-brand-tag">Create your account</p>
      </div>

      <form id="signup-form" class="auth-form" novalidate>
        <div class="field" data-reveal style="--reveal-y: 10px">
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" maxlength="100" required />
        </div>

        <div class="field" data-reveal style="--reveal-y: 10px">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field" data-reveal style="--reveal-y: 10px">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required />
          <!-- Mirrors enforcePasswordComplexity in internal/service/auth.go.
               Stated up front so the rules aren't discovered one 400 at a time;
               the server remains the authority. -->
          <p class="field-hint">
            At least 8 characters, with one uppercase letter and one special character.
          </p>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" data-reveal style="--reveal-y: 10px">
          <span id="submit-label">Create account</span>
        </button>
      </form>

      <p class="auth-alt">
        Already have an account? <a href="/login">Sign in</a>
      </p>
      <p class="auth-alt">Running locally — nothing you enter leaves this machine.</p>
    </main>
    <script type="module" src="/src/signup.ts"></script>
  </body>
</html>
